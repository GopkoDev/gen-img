openapi: 3.1.0
info:
  title: Ukiyo — gallery-grid
  version: 0.1.0
  description: >
    Delta for roadmap step 11 over the shipped list contract (text-to-image-openrouter, curate-gallery,
    app-shell): GenerationSummary gains `durationMs` (additive). Paging is unchanged — newest first, `cursor` =
    the last generation id shown, `limit` 1–100 (default 24). A pending card re-reads GET /generations/{id}
    (unchanged). Every /api route passes the request guard (ADR-0007).
servers:
  - url: http://127.0.0.1:8787/api
security: []
paths:
  /generations:
    get:
      operationId: listGenerations
      summary: One page of generation summaries, newest first (AC-01…AC-06)
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, pattern: "^[0-9A-Z]{1,26}$" }, description: "the id of the last generation shown; the page continues after it" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
      responses:
        "200":
          description: A page; `nextCursor` null on the last page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationPage" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: VALIDATION_ERROR (400) or FORBIDDEN (403)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    GenerationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GenerationSummaryDelta" } }
        nextCursor: { type: [string, "null"] }
    GenerationSummaryDelta:
      description: The shipped GenerationSummary plus `durationMs` (only the fields this step reads are listed)
      type: object
      required: [id, costMicros, costStatus, imagesRequested, imagesReceived, thumbnail, durationMs]
      properties:
        id: { type: string }
        costMicros: { type: [integer, "null"] }
        costStatus: { type: string, enum: [known, pending, unavailable] }
        imagesRequested: { type: integer }
        imagesReceived: { type: integer }
        durationMs: { type: integer, minimum: 0, description: "provider request sent → answer received (generations.duration_ms)" }
        thumbnail:
          type: object
          required: [url, width, height]
          properties:
            url: { type: string }
            width: { type: integer }
            height: { type: integer }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
