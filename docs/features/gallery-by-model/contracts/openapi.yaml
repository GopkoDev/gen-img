openapi: 3.1.0
info:
  title: Ukiyo — gallery-by-model
  version: 0.1.0
  description: >
    Delta for roadmap step 13 over the shipped list contract (gallery-grid): the list takes an optional
    provider + model filter (both or neither), and a new read returns every provider + model the Owner has
    generated with, its count and newest id, optionally with its latest summaries. Matching is exact (same
    characters, same case). Every /api route passes the request guard (ADR-0007).
servers:
  - url: http://127.0.0.1:8787/api
security: []
paths:
  /generations:
    get:
      operationId: listGenerations
      summary: One page of summaries, newest first, optionally one provider + model only (AC-01, AC-04, AC-05, AC-06)
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, pattern: "^[0-9A-Z]{1,26}$" } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 24 } }
        - { name: provider, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 200 }, description: "with model; both or neither; an unknown provider gives an empty page" }
        - { name: model, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 200 }, description: "exact stored model id; with provider" }
      responses:
        "200":
          description: A page (empty items + null nextCursor when the model has no generations — not an error)
          content: { application/json: { schema: { $ref: "#/components/schemas/GenerationPage" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /generations/models:
    get:
      operationId: listGenerationModels
      summary: Every provider + model the Owner generated with — count, newest id, and optionally its latest summaries (AC-01, AC-02, AC-05, AC-08)
      parameters:
        - { name: latest, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 4, default: 0 } }
      responses:
        "200":
          description: Models, the most recently used first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelGroupsResponse" }
              example: { models: [{ provider: openrouter, model: "bytedance/seedream-4", count: 12, latestId: "01K7ZQ3XJ0000000000000000", items: [] }] }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: VALIDATION_ERROR (400) or FORBIDDEN (403)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
  schemas:
    GenerationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/GenerationSummary" } }
        nextCursor: { type: [string, "null"] }
    GenerationSummary:
      description: The shipped summary (gallery-grid contract), unchanged
      type: object
      required: [id, provider, model]
      properties:
        id: { type: string }
        provider: { type: string, enum: [openrouter, vercel] }
        model: { type: string }
    ModelGroup:
      type: object
      required: [provider, model, count, latestId, items]
      properties:
        provider: { type: string, enum: [openrouter, vercel] }
        model: { type: string }
        count: { type: integer, minimum: 1 }
        latestId: { type: string }
        items: { type: array, maxItems: 4, items: { $ref: "#/components/schemas/GenerationSummary" } }
    ModelGroupsResponse:
      type: object
      required: [models]
      properties:
        models: { type: array, items: { $ref: "#/components/schemas/ModelGroup" } }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
